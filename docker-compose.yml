services:
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.10-34.3
    ports:
      - "389:389"
      - "636:636"
    environment:
      ARCHIVE_HOST: ${ARCHIVE_HOST}
      STORAGE_DIR: /storage/fs1
    volumes:
      - /var/local/dcm4chee-arc/ldap:/var/lib/openldap/openldap-data
      - /var/local/dcm4chee-arc/slapd.d:/etc/openldap/slapd.d
  db:
    image: mariadb:11.4
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: pacsdb
      MARIADB_USER: pacs
      MARIADB_PASSWORD: pacs
      MARIADB_ROOT_PASSWORD: pacsroot
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/db:/var/lib/mysql
  db-init:
    image: alpine:3.20
    restart: "no"
    depends_on:
      - db
    environment:
      MARIADB_ROOT_PASSWORD: pacsroot
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      apk add --no-cache mariadb-client curl > /dev/null;
      until mariadb-admin ping -h db -u root -p"$$MARIADB_ROOT_PASSWORD" --silent; do
        sleep 2;
      done;
      TABLE_COUNT=$$(mariadb -h db -u root -p"$$MARIADB_ROOT_PASSWORD" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='pacsdb';");
      if [ "$$TABLE_COUNT" != "0" ]; then
        echo "Schema pacsdb ja inicializado, pulando import.";
        exit 0;
      fi;
      curl -fsSL https://allclinic.com.br/dcm4che/5.34.3/create-mysql.sql -o /tmp/create-mysql.sql;
      mariadb -h db -u root -p"$$MARIADB_ROOT_PASSWORD" < /tmp/create-mysql.sql;
      echo "SQL remoto aplicado com sucesso .";
  arc:
    image: dcm4che/dcm4chee-arc-mysql:5.34.3
    ports:
      - "8081:8080"
      - "8443:8443"
      - "9990:9990"
      - "9993:9993"
      - "8787:8787"
      - "11112:11112"
      - "2762:2762"
      - "2575:2575"
      - "12575:12575"
    environment:
      WILDFLY_ADMIN_USER: admin
      WILDFLY_ADMIN_PASSWORD: admin
      WILDFLY_DEPLOY_UI: "false"
      WILDFLY_PACSDS_USE_CCM: "false"
      MYSQL_DB: pacsdb
      MYSQL_USER: pacs
      MYSQL_PASSWORD: pacs
      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 db:3306
      JAVA_OPTS: -Xms64m -Xmx512m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m -Djava.net.preferIPv4Stack=true -Djboss.modules.system.pkgs=org.jboss.byteman -Djava.awt.headless=true -agentlib:jdwp=transport=dt_socket,address=*:8787,server=y,suspend=n
    depends_on:
      ldap:
        condition: service_started
      db:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/wildfly:/opt/wildfly/standalone
      - /var/local/dcm4chee-arc/storage:/storage
  ui:
    image: dcm4che/dcm4chee-arc-mysql:5.34.3
    ports:
      - "18080:18080"
      - "18443:18443"
      - "19990:19990"
      - "19993:19993"
      - "8888:8888"
    environment:
      WILDFLY_ADMIN_USER: admin
      WILDFLY_ADMIN_PASSWORD: admin
      WILDFLY_DEPLOY_UI: only
      WILDFLY_PACSDS_USE_CCM: "false"
      DCM4CHEE_ARC_URLS: http://${ARCHIVE_HOST}:8081/dcm4chee-arc
      HTTP_PORT: 18080
      HTTPS_PORT: 18443
      MANAGEMENT_HTTP_PORT: 19990
      MANAGEMENT_HTTPS_PORT: 19993
      WILDFLY_WAIT_FOR: arc:8080
      JAVA_OPTS: -Xms64m -Xmx512m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m -Djava.net.preferIPv4Stack=true -Djboss.modules.system.pkgs=org.jboss.byteman -Djava.awt.headless=true -agentlib:jdwp=transport=dt_socket,address=*:8888,server=y,suspend=n
    depends_on:
      - arc
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/ui:/opt/wildfly/standalone
