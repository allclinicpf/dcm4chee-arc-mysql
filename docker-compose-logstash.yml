services:
  elasticsearch:
    image: elasticsearch:8.15.1
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      http.cors.enabled: "true"
      http.cors.allow-origin: "/.*/"
      http.cors.allow-headers: "X-Requested-With,Content-Length,Content-Type,Authorization"
      discovery.type: single-node
      xpack.security.enabled: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/esdatadir:/usr/share/elasticsearch/data
  kibana:
    image: kibana:8.15.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  logstash:
    image: dcm4che/logstash-dcm4chee:8.15.1-18
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "12201:12201/udp"
      - "8514:8514/udp"
      - "8514:8514"
      - "6514:6514"
    depends_on:
      - elasticsearch
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/logstash/filter-hashtree:/usr/share/logstash/data/filter-hashtree
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.10-34.3
    logging:
      driver: gelf
      options:
        gelf-address: "udp://${ARCHIVE_HOST}:12201"
        tag: slapd
    ports:
      - "389:389"
      - "636:636"
    environment:
      ARCHIVE_HOST: ${ARCHIVE_HOST}
      STORAGE_DIR: /storage/fs1
      SYSLOG_HOST: logstash
      SYSLOG_PORT: 8514
      SYSLOG_PROTOCOL: TLS
    depends_on:
      - logstash
    volumes:
      - /var/local/dcm4chee-arc/ldap:/var/lib/openldap/openldap-data
      - /var/local/dcm4chee-arc/slapd.d:/etc/openldap/slapd.d
  db:
    image: mariadb:11.4
    logging:
      driver: gelf
      options:
        gelf-address: "udp://${ARCHIVE_HOST}:12201"
        tag: mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: pacsdb
      MARIADB_USER: pacs
      MARIADB_PASSWORD: pacs
      MARIADB_ROOT_PASSWORD: pacsroot
    depends_on:
      - logstash
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/db:/var/lib/mysql
  db-init:
    image: alpine:3.20
    logging:
      driver: gelf
      options:
        gelf-address: "udp://${ARCHIVE_HOST}:12201"
        tag: db-init
    restart: "no"
    depends_on:
      - db
    environment:
      MARIADB_ROOT_PASSWORD: pacsroot
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      apk add --no-cache mariadb-client curl > /dev/null;
      until mariadb-admin ping -h db -u root -p"$$MARIADB_ROOT_PASSWORD" --silent; do
        sleep 2;
      done;
      TABLE_COUNT=$$(mariadb -h db -u root -p"$$MARIADB_ROOT_PASSWORD" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='pacsdb';");
      if [ "$$TABLE_COUNT" != "0" ]; then
        echo "Schema pacsdb ja inicializado, pulando import.";
        exit 0;
      fi;
      curl -fsSL https://allclinic.com.br/dcm4che/5.34.3/create-mysql.sql -o /tmp/create-mysql.sql;
      mariadb -h db -u root -p"$$MARIADB_ROOT_PASSWORD" < /tmp/create-mysql.sql;
      echo "SQL remoto aplicado com sucesso.";
  arc:
    image: dcm4che/dcm4chee-arc-mysql:5.34.3
    logging:
      driver: gelf
      options:
        gelf-address: "udp://${ARCHIVE_HOST}:12201"
        tag: dcm4chee-arc
    ports:
      - "8081:8080"
      - "8443:8443"
      - "9990:9990"
      - "9993:9993"
      - "8787:8787"
      - "11112:11112"
      - "2762:2762"
      - "2575:2575"
      - "12575:12575"
    environment:
      WILDFLY_ADMIN_USER: admin
      WILDFLY_ADMIN_PASSWORD: admin
      WILDFLY_PACSDS_USE_CCM: "false"
      LOGSTASH_HOST: logstash
      MYSQL_DB: pacsdb
      MYSQL_USER: pacs
      MYSQL_PASSWORD: pacs
      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 db:3306 logstash:8514
    depends_on:
      ldap:
        condition: service_started
      db:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      logstash:
        condition: service_started
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/wildfly:/opt/wildfly/standalone
      - /var/local/dcm4chee-arc/storage:/storage
